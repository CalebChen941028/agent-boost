<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>agent-boost Report Preview (ZCode Panel)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e1e;
      color: #cccccc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #252526;
      border-bottom: 1px solid #333333;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: #007acc;
      color: #ffffff;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: #0098ff; }
    iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="title">
      <span>🚀 agent-boost Benchmark Results Dashboard</span>
    </div>
    <div>
      <select id="report-select" class="btn" style="background:#333;margin-right:8px;padding:4px 8px;" onchange="document.getElementById('report-frame').src=this.value">
        <option value="../../live-results/report.html">Default Report (Latest Run)</option>
        <option value="../../live-results/cross-model-comparison.html">Cross-Model Comparison (mimo vs deepseek)</option>
        <option value="../../live-results/report-deepseek-12tasks.html">DeepSeek 12-Task Report</option>
        <option value="../../live-results/report-opt-tiers.html">Option B Adaptive Tiers Report</option>
        <option value="../../live-results/report-hard-cascade.html">Option A Cascade Tasks Report</option>
        <option value="../../live-results/report-extreme-ceiling-break.html">Tasks 13-15 Ceiling-Break Report</option>
        <option value="../../live-results/report-high-intensity.html">Tasks 16-18 High-Intensity Benchmark Report</option>
        <option value="../../live-results/report-18tasks-grand-slam.html">18-Task Grand Slam Full Benchmark Report</option>
      </select>
      <button class="btn" onclick="document.getElementById('report-frame').contentWindow.location.reload()">Refresh Report</button>
    </div>
  </div>
  <iframe id="report-frame" src="../../live-results/report.html"></iframe>
</body>
</html>
